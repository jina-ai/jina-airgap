name: Build and push Docker images

# Builds all prebuilt model images and pushes them to GHCR.
# CPU images are built as multi-arch manifests (linux/amd64 + linux/arm64) using
# QEMU emulation on the amd64 runner. GPU images are amd64-only because the
# pytorch/pytorch CUDA base image and the flash-attn prebuilt wheels are x86-64 only.
#
# Trigger manually via the Actions tab, or automatically on version tags.
# Use the "models" input to build a single model first to validate before a
# full run (28 models x 2 variants = 56 images; each takes 20-60 min).
#
# Note: for faster arm64 builds, replace the QEMU approach with a matrix of
# native runners (ubuntu-24.04 + ubuntu-24.04-arm) and a manifest-merge job.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Comma-separated variants to build (cpu, gpu)"
        default: "cpu,gpu"
        required: false
      models:
        description: "Comma-separated model IDs to limit to (empty = all prebuilt)"
        default: ""
        required: false
      push:
        description: "Push images to GHCR (uncheck for a dry-run build)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          VARIANTS: ${{ inputs.variants || 'cpu,gpu' }}
          ONLY_MODELS: ${{ inputs.models || '' }}
        run: |
          matrix=$(python3 - <<'PY'
          import json, os
          want = {v.strip() for v in os.environ["VARIANTS"].split(",") if v.strip()}
          only = {m.strip() for m in os.environ.get("ONLY_MODELS", "").split(",") if m.strip()}
          cat = json.load(open("models/catalog.json"))
          rows = []
          for m in cat["models"]:
              if not m.get("prebuilt"):
                  continue
              if only and m["id"] not in only:
                  continue
              for variant in (m.get("prebuilt_versions") or {}):
                  if variant in want:
                      rows.append({"model_id": m["id"], "variant": variant})
          print(json.dumps({"include": rows}))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -m json.tool

  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata and write model deps
        id: meta
        env:
          MODEL_ID: ${{ matrix.model_id }}
          VARIANT: ${{ matrix.variant }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os

          model_id = os.environ["MODEL_ID"]
          variant = os.environ["VARIANT"]
          repo_owner = os.environ["REPO_OWNER"].lower()

          cat = json.load(open("models/catalog.json"))
          model = next(m for m in cat["models"] if m["id"] == model_id)

          # Replicate what jina-on-prem.py bundle does before docker build:
          # write pinned per-model deps so the Dockerfile COPY step picks them up.
          deps = model.get("deps", {})
          lines = [f"{pkg}{spec}" for pkg, spec in deps.items() if spec is not None]
          with open("docker/model-requirements.txt", "w") as f:
              f.write("\n".join(lines) + "\n" if lines else "# no model-specific deps\n")

          # CPU: multi-arch (amd64 + arm64). GPU: amd64-only (CUDA constraint).
          platforms = "linux/amd64,linux/arm64" if variant == "cpu" else "linux/amd64"

          image = f"ghcr.io/{repo_owner}/jina-on-prem/{model_id.lower()}:{variant}"
          extra_repos = ",".join(model.get("extra_repos", []))

          build_args = f"MODEL_ID={model['hf_repo']}\nEXTRA_REPOS={extra_repos}"
          if variant == "gpu" and model.get("gpu_dtype"):
              build_args += f"\nDTYPE={model['gpu_dtype']}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"platforms={platforms}\n")
              f.write(f"image={image}\n")
              f.write(f"build_args<<__EOF__\n{build_args}\n__EOF__\n")
          PY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            ${{ steps.meta.outputs.build_args }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
